<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    <!-- Google's <model-viewer> for inline GLB/GLTF inspection in review +
         activity modals. The script registers a single custom element; no
         runtime imports needed from app code. -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>
    <script>
      // Apply saved theme before paint to avoid a flash. Mirrors the
      // localStorage key used by the SettingsModal theme picker.
      (function () {
        try {
          var t = localStorage.getItem("agentFactory.theme") || "claude";
          var valid = ["claude", "espresso", "pine", "plum", "midnight", "linen"];
          if (valid.indexOf(t) === -1) t = "claude";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "claude");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
