[project]
name = "rater-bot"
version = "0.1.0"
requires-python = ">=3.11"
# Telegram-based operator rating loop. Reads new drafts from the shared
# SQLite db (path discovered via ~/.agent-factory/db_path.txt) and posts
# each one to a private Telegram chat with star buttons + a 3D-viewer
# link. Captures the rating + free-text note back into product_ratings
# and mirrors to ratings.jsonl for the orchestrator few-shot loop.
#
# requests powers the Bot API (sendPhoto / sendDocument / answerCallbackQuery
# / getUpdates). stdlib sqlite3 handles persistence.
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
